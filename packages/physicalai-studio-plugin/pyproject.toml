[project]
name = "physicalai-studio-plugin"
version = "0.1.0"
description = "Plugin SDK for Physical AI Studio — types and protocols for building robot catalog plugins"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "physicalai>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_studio_plugin"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
testpaths = "tests"
pythonpath = "src"
