[project]
name = "physicalai-studio-plugin"
dynamic = ["version"]
description = "Plugin SDK for Physical AI Studio — types and protocols for building robot catalog plugins"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "physicalai>=0.1.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^physicalai-studio-plugin-v(?P<version>\d+(?:\.\d+)*)$'
raw-options = { search_parent_directories = true, git_describe_command = "git describe --dirty --tags --long --match physicalai-studio-plugin-v*" }

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_studio_plugin"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
testpaths = "tests"
pythonpath = "src"
